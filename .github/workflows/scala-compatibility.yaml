name: Scala 2.12.18 MR3 API compatibility

on:
  push:
    branches:
      - master
      - experiment/scala-2.12-mr3-2.3.1
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  scala-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install locally built MR3 JMockit agent
        run: ./mvnw -pl main -am install -Dmaven.test.skip=true -Dmodernizer.skip=true -Dlicense.skip=true --batch-mode
      - name: Run Scala 2.12.18 compatibility tests
        run: ./mvnw -pl scalaCompatibility test -Dlicense.skip=true --batch-mode
